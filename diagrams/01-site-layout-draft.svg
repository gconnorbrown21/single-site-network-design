  <text x="1285" y="770" class="label">Outside Registers</text>
  <g class="reg">
    <polygon points="1320,800 1308,832 1332,832"/><polygon points="1385,800 1373,832 1397,832"/>
    <polygon points="1320,850 1308,882 1332,882"/><polygon points="1385,850 1373,882 1397,882"/>
  </g>

  <rect x="1225" y="92" width="325" height="255" rx="12" class="legendbox"/>
  <text x="1250" y="126" class="sub">Legend</text>
  <polygon points="1267,152 1255,184 1279,184" class="reg"/>
  <text x="1300" y="176" class="small">Manned POS / Register</text>
  <circle cx="1267" cy="214" r="14" class="sco"/>

  <rect x="166" y="98" width="230" height="92" rx="10" class="zone"/>
  <text x="235" y="178" class="label">Training</text>

  <rect x="85" y="112" width="44" height="32" rx="7" class="office"/>
  <rect x="85" y="158" width="44" height="32" rx="7" class="office"/>
  <rect x="85" y="204" width="44" height="32" rx="7" class="office"/>

  <rect x="184" y="116" width="48" height="34" rx="7" class="training"/>
  <rect x="245" y="116" width="48" height="34" rx="7" class="training"/>
  <rect x="306" y="116" width="48" height="34" rx="7" class="training"/>

  <rect x="425" y="110" width="48" height="34" rx="7" class="pc"/>
  <rect x="980" y="110" width="48" height="34" rx="7" class="pc"/>
  <rect x="1045" y="110" width="48" height="34" rx="7" class="pc"/>

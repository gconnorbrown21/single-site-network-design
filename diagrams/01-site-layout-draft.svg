  <rect x="675" y="280" width="48" height="34" rx="7" class="pc"/>
  <rect x="610" y="350" width="48" height="34" rx="7" class="pc"/>
  <rect x="675" y="350" width="48" height="34" rx="7" class="pc"/>
  <rect x="210" y="430" width="48" height="34" rx="7" class="pc"/>
  <rect x="275" y="430" width="48" height="34" rx="7" class="pc"/>
  <rect x="1030" y="410" width="48" height="34" rx="7" class="pc"/>

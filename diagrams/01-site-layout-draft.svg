<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#123a70}
      .sub{font:600 18px Arial,Helvetica,sans-serif;fill:#123a70}
      .label{font:600 17px Arial,Helvetica,sans-serif;fill:#123a70}
      .small{font:500 15px Arial,Helvetica,sans-serif;fill:#123a70}
      .tiny{font:500 13px Arial,Helvetica,sans-serif;fill:#123a70}
      .outline{fill:#fff;stroke:#1f5fae;stroke-width:4}
      .zone{fill:#f7faff;stroke:#9bbce6;stroke-width:2;stroke-dasharray:7 5}
      .outside{fill:#eef7ea;stroke:#6ea65f;stroke-width:2.5}
      .pc{fill:#3d75c6;stroke:#23599f;stroke-width:2}
      .office{fill:#63a85b;stroke:#3b7d35;stroke-width:2}
      .training{fill:#8b69c6;stroke:#6749a7;stroke-width:2}
      .reg{fill:#3d75c6;stroke:#23599f;stroke-width:2}
      .sco{fill:#3d75c6;stroke:#23599f;stroke-width:2}
      .legendbox{fill:#f8fbff;stroke:#a9c3e8;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="42" y="48" class="title">Conceptual Retail Site Layout – Endpoint Distribution (Draft v2)</text>


  <text x="50" y="865" class="small">Approximate Site Size: ~150,000 sq. ft. (approx. 500 ft × 300 ft)</text>
  <text x="50" y="892" class="small">Conceptual diagram – not to scale.</text>
  <text x="50" y="919" class="small">Built as a portfolio exercise for single-site network infrastructure planning.</text>
  <text x="1400" y="956" class="tiny">v2.1 | 2026-09-16</text>
</svg>